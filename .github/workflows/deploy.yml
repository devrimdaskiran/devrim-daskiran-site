# Her "main" dalına gönderimde siteyi derler, CV PDF'ini üretir ve GitHub Pages'e yayınlar.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Chromium kur (CV PDF için)
        run: npx playwright install --with-deps chromium

      - name: Siteyi derle ve CV PDF'ini oluştur
        run: npm run build:all

      - name: Çıktıyı kontrol et
        run: |
          test -f dist/index.html
          test -f dist/cv/index.html
          test -s dist/cv/devrim-daskiran-cv.pdf
          test -f dist/sitemap.xml

      - name: Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
